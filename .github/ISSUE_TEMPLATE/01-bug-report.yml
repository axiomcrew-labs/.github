name: Bug report / 问题反馈
description: Report a reproducible problem. / 反馈可复现的问题。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this project. Please search existing issues first and submit this report in the affected project's repository.
        感谢帮助改进项目。请先搜索已有 Issue，并在出现问题的项目仓库提交反馈。

        You can answer in English or Chinese. / 可以使用中文或英文填写。
  - type: input
    id: version
    attributes:
      label: Project version / 项目版本
      description: Release, tag, or commit SHA; write "unknown" if unavailable. / 填写版本、标签或提交 SHA；无法确定时填写“未知”。
      placeholder: "Version, tag, commit SHA, or unknown / 版本、标签、提交 SHA 或未知"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Include the OS and relevant application or runtime versions. Add model and hardware details only if relevant. / 填写操作系统及相关应用或运行时版本；模型和硬件信息仅在相关时提供。
      placeholder: |
        OS / 操作系统：
        Application or runtime / 应用或运行时：
        Model or hardware, if relevant / 模型或硬件（如相关）：
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Give the smallest example and steps that reproduce the problem. / 提供能复现问题的最小示例和操作步骤。
      placeholder: |
        1. Preparation / 准备条件：
        2. Action / 执行操作：
        3. Result / 出现结果：
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
      description: What did you expect to happen? / 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: What happened instead? Include the error message if available. / 实际发生了什么？如有错误提示，请一并提供。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or context / 日志、截图或补充说明
      description: Optional. Attach only relevant excerpts; remove API keys, credentials, and private data. / 选填。仅提供相关片段，并移除 API 密钥、凭证和私有数据。
    validations:
      required: false
